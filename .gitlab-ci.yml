stages:
  - build
  - test

build-job:
  stage: build
  script:
    - echo "Compilation du code..."
    - mkdir -p bin
    - javac -d bin -cp "lib/*" $(find src/main -name "*.java") $(find src/test -name "*.java")
    - echo "Compilation terminée."

test-job:
  stage: test
  script:
    - echo "Exécution des tests..."
    - java -cp "bin:lib/*" org.junit.platform.console.ConsoleLauncher --classpath bin --scan-classpath
    - echo "Tests terminés."
