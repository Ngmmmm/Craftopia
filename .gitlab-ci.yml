stages:          # Liste des étapes pour les jobs, dans l'ordre d'exécution
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - echo "Compilation du fichier Main.java..."
    - mkdir -p bin
    - javac -d bin src/app/**/*.java
    - echo "Compilation terminée avec succès."
  artifacts:
    paths:
      - bin

test:
  stage: test
  script:
    - echo "Compilation des fichiers de test..."
    - javac -cp ".;lib/junit-jupiter-api-5.11.3.jar;lib/junit-platform-console-standalone-1.11.3.jar" -d bin src/app/**/*.java src/test/*.java
    - echo "Exécution des tests..."
    - java -cp "bin;lib/junit-platform-console-standalone-1.11.3.jar;lib/junit-jupiter-api-5.11.3.jar" org.junit.platform.console.ConsoleLauncher --scan-classpath
  dependencies:
    - build

deploy:
  stage: deploy
  environment: production
  script:
    - echo "Déploiement de l'application..."
    - echo "Application déployée avec succès."
