stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - deploy

build:           # This job runs in the build stage, which runs first.
  stage: build
  script:
    - echo "Compiling the code..."
    - javac -cp ".:lib/junit-jupiter-api-5.11.3.jar:lib/junit-platform-console-standalone-1.11.3.jar" -d bin src/app/**/*.java src/test/*.java
    - echo "Compile complete."
    
test:            # This job runs in the test stage.
  stage: test     # It only starts when the job in the build stage completes successfully.
  script:
    - echo "Running unit tests..."
    - java -cp "bin:lib/junit-platform-console-standalone-1.11.3.jar:lib/junit-jupiter-api-5.11.3.jar" org.junit.platform.console.ConsoleLauncher --scan-classpath
    - echo "Code coverage is 90%"
    
deploy:          # This job runs in the deploy stage.
  stage: deploy   # It only runs when both jobs in the test stage complete successfully.
  environment: production
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."
